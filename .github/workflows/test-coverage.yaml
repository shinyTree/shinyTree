name: test-coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PKG_SYSREQS: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Point chromote at the installed Chrome binary
        run: echo "CHROMOTE_CHROME=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      # pak would install chromote's "Chrome" system requirement as Chromium from
      # the ppa:xtradeb/apps Launchpad PPA, which is often unavailable (503) and
      # failed whole runs before any test ran. Chrome already comes from
      # setup-chrome above, and chromote is pointed at it, so that Chromium is
      # never used. Install the remaining system requirements from Ubuntu's own
      # mirror instead, and tell pak not to install any itself.
      - name: Install system requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libicu-dev \
            libuv1-dev zlib1g-dev cmake make pandoc

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::shinytest2
          needs: coverage

      - name: Test coverage
        run: |
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
        shell: Rscript {0}
        # Requires a CODECOV_TOKEN secret to be configured in the repository
        # settings (Settings > Secrets and variables > Actions) for uploads
        # to succeed; see https://docs.codecov.com/docs/adding-the-codecov-token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
